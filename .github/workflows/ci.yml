name: ci

# Every push and pull request gets the same four checks a contributor is
# asked to run locally. A tag or manual run also packages and attests the
# three release files. Nothing here publishes, tags or creates a release.
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default. The provenance job grants its own narrow attestation
# permissions; the ordinary check job keeps only source access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A push to a branch in this repo and the pull_request GitHub opens for
    # that same branch are the same commit; without this a same-repo PR ran
    # the whole matrix twice. pull_request still runs for a fork PR, which
    # has no matching push event here. K2, audit-fixes-design.md 5k.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      # Both majors that matter. Node 21 added a global `navigator`, so
      # code that reads one can pass on a developer machine running 22
      # and throw on this runner - which is how 1.3.11 shipped red.
      matrix:
        node: [20, 22]
    steps:
      # Actions are pinned to stable major versions. The repository has no
      # stricter pinning policy; commit-SHA pinning is the harder option if
      # one is adopted later.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: exactly what package-lock.json pins, and it fails
      # rather than quietly rewriting the lock.
      - run: npm ci

      # Chromium for the rendered-geometry suite. `--with-deps` installs the
      # system libraries (libgbm, libnss3, etc.) that headless Chromium needs
      # on a stock Ubuntu runner. Placed here so the binary is ready when the
      # `rendered geometry` step runs after `tests`.
      - name: install chromium
        run: npx playwright install chromium --with-deps

      # The version lives in three files and they must agree. The
      # packager checks this too, but only at packaging time - after the
      # commit, the push, and the decision to ship.
      - name: versions agree
        run: node scripts/check-versions.mjs

      # docs/demo.js is committed and served straight from docs/ - nothing
      # rebuilt or checked it before this, and it was 21 bytes stale on
      # 2026-09-02 (audit doc §5e/F1), the site quietly drawing with an
      # older ink path than the one users install.
      - name: site bundle is current
        run: npm run check:site

      - name: typecheck
        run: npx tsc -noEmit

      - name: tests
        run: npm test

      # The rendered-geometry suite: launches real Chromium, builds the tool
      # strip under the real stylesheet, and measures pixel widths. Kept out
      # of `npm test` on purpose so the unit count and timing stay clean; run
      # here as its own step. Hard fail rather than skip on missing browser -
      # a guard nobody runs is a guard that is right and unread.
      - name: rendered geometry
        run: npm run test:render

      # esbuild directly, not `npm run build` (which is `tsc -noEmit &&
      # esbuild...`): the typecheck step above already ran tsc over the same
      # commit, so this just proves the bundle esbuild produces - what
      # Obsidian's scanner selects - builds clean from a clean checkout.
      # `npm run build` is left as-is so a local build still typechecks.
      - name: production build
        run: node esbuild.config.mjs production

  provenance:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The release command refuses a dirty tree, rebuilds main.js, reads
      # manifest.json and styles.css from the same commit, and writes hashes.
      - name: package release assets
        run: npm run release

      - name: upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: handwriting-release-${{ github.ref_name }}
          path: |
            release/main.js
            release/manifest.json
            release/styles.css
          if-no-files-found: error

      # New workflows use the general attestation action. It binds each
      # shipped file's digest to this repository, commit and workflow run.
      - name: attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
